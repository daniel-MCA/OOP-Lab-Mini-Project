<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AdaptQ</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; }
  .demo-hint { background: #0e1220; border: 1px dashed var(--border); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: var(--text-dim); margin-top: 18px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand mb-24"><span class="brand-badge">🧠</span> AdaptQ</div>
    <h2 style="margin-top:0;">Welcome back</h2>
    <p class="text-dim mb-24" style="font-size:14px;">Sign in to continue your learning.</p>

    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" required placeholder="Your username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
    </form>

    <p class="text-dim mt-16" style="text-align:center; font-size:14px;">
      New here? <a href="/signup.html" style="color: var(--accent); font-weight:600;">Create an account</a>
    </p>

    <div class="demo-hint">
      Demo logins — Student: <b>student</b> / <b>student123</b> &nbsp;·&nbsp; Admin: <b>admin</b> / <b>admin123</b>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Signing in...";
    try {
      const user = await Api.post("/api/auth/login", {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      });
      Session.save(user);
      window.location.href = user.role === "ADMIN" ? "/admin.html" : "/student-home.html";
    } catch (err) {
      toast(err.message, "error");
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
