<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Report — AdaptQ</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .report-wrap { max-width: 860px; margin: 0 auto; }
  .score-banner { text-align: center; padding: 32px 20px; }
  .score-big { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .review-item { border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; background: var(--bg-card); }
  .review-item.wrong { border-color: #f3c6c9; background: #fff7f7; }
  .review-item.right { border-color: #bfe9d8; background: #f5fdfa; }
  .review-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .review-qtext { font-weight: 650; font-size: 15.5px; line-height: 1.5; }
  .verdict { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .verdict.ok { color: var(--success); }
  .verdict.no { color: var(--danger); }
  .option-line { padding: 8px 12px; border-radius: 9px; font-size: 14px; margin-bottom: 6px; border: 1px solid var(--border); }
  .option-line.is-correct { border-color: #16a879; background: rgba(22,168,121,.09); font-weight: 650; }
  .option-line.is-wrong-pick { border-color: var(--danger); background: rgba(228,91,99,.09); font-weight: 650; }
  .review-explain { margin-top: 10px; font-size: 13.5px; color: var(--text-dim); background: var(--bg-soft); border-radius: 10px; padding: 10px 12px; }
  .review-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .review-meta span { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="report-wrap" id="reportRoot">
      <div class="card" style="text-align:center;"><div class="spinner" style="margin:20px auto;"></div>Loading report…</div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  const user = Session.requireRole("STUDENT");
  renderSidebar("tests");
  const params = new URLSearchParams(location.search);
  const attemptId = params.get("attemptId");

  function letterOptions(item) {
    return ["A", "B", "C", "D"].map(letter => {
      const text = item["option" + letter];
      const classes = ["option-line"];
      if (letter === item.correctOption) classes.push("is-correct");
      else if (letter === item.selectedOption && letter !== item.correctOption) classes.push("is-wrong-pick");
      return `<div class="${classes.join(" ")}">${letter}. ${escapeHtml(text)}${letter === item.correctOption ? " ✓" : ""}${(letter === item.selectedOption && letter !== item.correctOption) ? " (your answer)" : ""}</div>`;
    }).join("");
  }

  async function load() {
    let report;
    try {
      report = await Api.get(`/api/practice/report/${attemptId}`);
    } catch (err) {
      document.getElementById("reportRoot").innerHTML = `<div class="card">Couldn't load this report: ${escapeHtml(err.message)}</div>`;
      return;
    }

    const scoreColor = report.scorePercent >= 70 ? "var(--success)" : report.scorePercent >= 40 ? "var(--warning)" : "var(--danger)";

    const itemsHtml = report.items.map((item, idx) => {
      const wasAnswered = item.selectedOption && item.selectedOption.length > 0;
      const stateClass = item.correct ? "right" : "wrong";
      const seconds = (item.timeTakenMs / 1000).toFixed(1);
      return `
        <div class="review-item ${stateClass}">
          <div class="review-head">
            <div class="review-qtext">Q${idx + 1}. ${escapeHtml(item.questionText)}</div>
            <div class="verdict ${item.correct ? "ok" : "no"}">${item.correct ? "✅ Correct" : (wasAnswered ? "❌ Incorrect" : "⏳ Not answered")}</div>
          </div>
          ${letterOptions(item)}
          ${item.explanation ? `<div class="review-explain">💡 ${escapeHtml(item.explanation)}</div>` : ""}
          <div class="review-meta">
            <span>🏷 ${escapeHtml(item.topic)}</span>
            <span>📈 Difficulty: <b>${item.difficultyLabelAtAttempt}</b> (${item.difficultyAtAttempt.toFixed(2)})</span>
            <span>⏱ ${seconds}s taken</span>
          </div>
        </div>
      `;
    }).join("");

    document.getElementById("reportRoot").innerHTML = `
      <div class="card score-banner">
        <div class="text-dim" style="font-size:13px;font-weight:700;">${escapeHtml(report.subject)} · ${escapeHtml(report.mode)}</div>
        <div class="score-big" style="color:${scoreColor}">${report.scorePercent}%</div>
        <p class="text-dim">${report.correctAnswers} of ${report.totalQuestions} correct</p>
      </div>

      <h2 style="margin-top:24px;">Question-by-question review</h2>
      ${itemsHtml}

      <div class="flex gap-12 mt-24" style="justify-content:center;">
        <button class="btn btn-primary" onclick="location.href='/subject.html?subject=${encodeURIComponent(report.subject)}'">Practice this subject</button>
        <button class="btn btn-secondary" onclick="location.href='/student-home.html'">Back to Dashboard</button>
      </div>
    `;
  }

  load();
</script>
</body>
</html>
