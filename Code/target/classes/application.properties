# =========================================================================
# Self-Calibrating Question Bank Engine - configuration
# =========================================================================

spring.application.name=adaptq-question-bank-engine
server.port=8080

# --- Default: H2 in-memory DB so the project runs instantly with zero setup ---
spring.datasource.url=jdbc:h2:file:./data/qbankdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- To use MySQL instead, comment the H2 block above and uncomment this: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/qbank_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
